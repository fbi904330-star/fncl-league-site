<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Football Zone</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #1f1f1f;
            padding: 20px;
            text-align: center;
            border-bottom: 3px solid #00ffcc;
        }
        h1 {
            margin: 0;
            color: #00ffcc;
        }
        .container {
            max-width: 800px;
            margin: 30px auto;
            padding: 20px;
            background-color: #1e1e1e;
            border-radius: 8px;
        }
        h2 {
            border-bottom: 2px solid #00ffcc;
            padding-bottom: 5px;
        }
        .fixture-match {
            display: flex;
            justify-content: space-between;
            background-color: #2a2a2a;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
            font-weight: bold;
        }
        .time {
            color: #00ffcc;
        }
    </style>
</head>
<body>

    <header>
        <h1>My Football Zone</h1>
        <p>Welcome to my ultimate football hub!</p>
    </header>

    <div class="container">
        <h2>Upcoming Fixtures</h2>
        
        <div class="fixture-match">
            <span>Team A vs Team B</span>
            <span class="time">Saturday, 3:00 PM</span>
        </div>

        <div class="fixture-match">
            <span>Team C vs Team D</span>
            <span class="time">Saturday, 5:30 PM</span>
        </div>

        <div class="fixture-match">
            <span>Team E vs Team F</span>
            <span class="time">Sunday, 4:00 PM</span>
        </div>
    </div>

</body>
</html>
